name: Publish 2.x Update Channels

# 把已发布的 2.x release 推到 kwikpaste-updater 读的两个地址（见 crates/kwikpaste-updater/src/channel.rs）：
#   七牛（国内主通道）  dl.fastthree.com/kwikpaste/v2/stable/latest.json，安装包传到 kwikpaste/stable/<tag>/
#                      （与 1.x 相同的目录结构，官网下载链接规则不变）。
#   GitHub（兜底）      channel-v2-stable 指针 release 里的 latest-v2.json（预发布，永远不会成为 latest）。
# 2.x 只有一个更新渠道（地址里沿用 stable 这个名字）：-beta.N、-rc.N 和正式版发布后都推到这里，其他预发布后缀拒绝。
#
# 只处理主版本 ≥2 的 tag；1.x 仍由 channel-pointer.yml 处理，它对 2.x 直接跳过。老通道（七牛 stable/beta/nightly、
# GitHub latest、channel-beta、channel-nightly）永远只有 1.x；2.x 在 GitHub 上的资产也永远不叫 latest.json。
#
# 由 native-release.yml 建的草稿被手动发布时触发（published 事件）；也可以 workflow_dispatch 传 tag 补跑。

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "已发布的 2.x release tag，例如 v2.0.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-update-channels-v2
  cancel-in-progress: false

env:
  MIRROR_BUCKET: kwikpaste
  MIRROR_PREFIX: kwikpaste
  MIRROR_BASE_URL: https://dl.fastthree.com/kwikpaste
  MIRROR_S3_ENDPOINT: https://s3.cn-south-1.qiniucs.com
  MIRROR_S3_REGION: cn-south-1

jobs:
  publish:
    name: Publish 2.x update channels
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag_name="${INPUT_TAG_NAME:-${RELEASE_TAG_NAME:-}}"
          if [[ -z "${tag_name}" ]]; then
            echo "::error::No release tag to work with."
            exit 1
          fi

          # >>> v1-skip
          major="${tag_name#v}"
          major="${major%%.*}"
          if [[ "${tag_name}" != v* || ! "${major}" =~ ^[0-9]+$ ]] || (( 10#${major} < 2 )); then
            echo "跳过：${tag_name} 不是 2.x 的版本 release（1.x 由 channel-pointer.yml 处理，channel-* 是指针）。"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # <<< v1-skip

          if [[ "${tag_name}" == *-* && "${tag_name}" != *-beta.* && "${tag_name}" != *-rc.* ]]; then
            echo "::error::${tag_name} is a prerelease kind 2.x does not publish."
            exit 1
          fi
          channel=stable

          release_id="$(gh api "repos/${GH_REPO}/releases/tags/${tag_name}" --jq .id)"
          gh api --paginate "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | {id, name, size, url, browser_download_url}' | jq -s . > assets.json
          jq -r '.[].name' assets.json > asset-names.txt

          # >>> no-latest-json
          if grep -qx 'latest.json' asset-names.txt; then
            echo "::error::The ${tag_name} release has a latest.json asset. Old clients read releases/latest/download/latest.json; 2.x must never publish one."
            exit 1
          fi
          # <<< no-latest-json

          manifest_id="$(jq -r '.[] | select(.name == "latest-v2.json") | .id' assets.json)"
          if [[ -z "${manifest_id}" ]]; then
            echo "::error::Release ${tag_name} has no latest-v2.json; native-release.yml uploads it to the draft."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${manifest_id}" > latest-v2.json
          manifest_version="$(jq -r .version latest-v2.json)"
          if [[ "v${manifest_version}" != "${tag_name}" ]]; then
            echo "::error::latest-v2.json is for ${manifest_version}, not ${tag_name}."
            exit 1
          fi

          # 渠道只前进：比指针当前版本旧的 release（后发布的积压草稿、补跑的旧 tag）不推；同一版本可以重跑。
          pointer_tag="channel-v2-${channel}"
          if gh release view "${pointer_tag}" > /dev/null 2>&1; then
            gh release download "${pointer_tag}" --pattern latest-v2.json --output current-v2.json
            current_version="$(jq -r .version current-v2.json)"
            if ! python3 - "${manifest_version}" "${current_version}" <<'PY'
          import sys

          def precedence(version):
              core, _, pre = version.split("+")[0].partition("-")
              ids = [(0, int(part), "") if part.isdigit() else (1, 0, part) for part in pre.split(".")] if pre else []
              return [int(part) for part in core.split(".")], not pre, ids

          new, current = sys.argv[1:]
          sys.exit(0 if precedence(new) >= precedence(current) else 1)
          PY
            then
              echo "::error::${tag_name} is older than ${current_version}, which ${pointer_tag} already points at."
              exit 1
            fi
          fi

          {
            echo "proceed=true"
            echo "channel=${channel}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Update GitHub channel pointer
        if: steps.resolve.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail

          pointer_tag="channel-v2-${CHANNEL}"
          notes="$(printf '2.x 的更新指针（%s），始终指向最新发布的 2.x 版本。\n\n当前指向：%s\n\n这个 release 只存放 latest-v2.json，安装包请到对应版本的 release 里下载。' "${CHANNEL}" "${TAG_NAME}")"

          if gh release view "${pointer_tag}" > /dev/null 2>&1; then
            gh release edit "${pointer_tag}" --prerelease --latest=false --title "${pointer_tag}" --notes "${notes}"
          else
            gh release create "${pointer_tag}" --prerelease --latest=false --title "${pointer_tag}" --notes "${notes}"
          fi
          gh release upload "${pointer_tag}" latest-v2.json --clobber

          echo "${pointer_tag} 已指向 ${TAG_NAME}。"

      - name: Mirror to Qiniu
        if: steps.resolve.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "${QINIU_ACCESS_KEY}" || -z "${QINIU_SECRET_KEY}" ]]; then
            echo "::notice::未配置 QINIU_ACCESS_KEY / QINIU_SECRET_KEY，跳过七牛镜像。"
            exit 0
          fi

          release_key="${MIRROR_PREFIX}/${CHANNEL}/${TAG_NAME}"
          release_url="${MIRROR_BASE_URL}/${CHANNEL}/${TAG_NAME}"

          mkdir -p assets
          while IFS=$'\t' read -r asset_id asset_name asset_size; do
            gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${asset_id}" > "assets/${asset_name}"
            actual_size="$(stat -c %s "assets/${asset_name}")"
            if [[ "${actual_size}" != "${asset_size}" ]]; then
              echo "::error::Downloaded ${asset_name} is ${actual_size} bytes, expected ${asset_size}."
              exit 1
            fi
          done < <(jq -r '.[] | select(.name != "latest-v2.json") | [.id, .name, .size] | @tsv' assets.json)

          # 清单里的下载地址换成七牛上的同名文件；签名签的是安装包字节，与下载地址无关，原样保留。
          jq --arg base "${release_url}" --slurpfile assets assets.json -f /dev/stdin latest-v2.json > latest.mirror.json <<'JQ'
          ($assets[0]
            | map({(.url): .name, (.browser_download_url): .name})
            | add) as $names
          | .platforms |= with_entries(
              .value.url as $url
              | ($names[$url] // error("latest-v2.json references an asset missing from the release: \($url)")) as $name
              | .value.url = "\($base)/\($name | @uri)"
            )
          JQ

          export AWS_ACCESS_KEY_ID="${QINIU_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${QINIU_SECRET_KEY}"
          export AWS_DEFAULT_REGION="${MIRROR_S3_REGION}"
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          s3() {
            aws s3 --endpoint-url "${MIRROR_S3_ENDPOINT}" --only-show-errors "$@"
          }

          # 先传安装包和签名，最后才覆盖清单：客户端不会拿到指向尚未上传文件的清单。清单只缓存 1 分钟。
          s3 cp assets/ "s3://${MIRROR_BUCKET}/${release_key}/" --recursive
          s3 cp latest.mirror.json "s3://${MIRROR_BUCKET}/${MIRROR_PREFIX}/v2/${CHANNEL}/latest.json" \
            --content-type application/json --cache-control "no-cache, max-age=60"

          mapfile -t urls < <(jq -r '.platforms[].url' latest.mirror.json | sort -u)
          for url in "${urls[@]}"; do
            code="$(curl -sS -o /dev/null -r 0-0 -w '%{http_code}' --retry 3 --retry-delay 5 "${url}")"
            if [[ "${code}" != "200" && "${code}" != "206" ]]; then
              echo "::error::Mirrored asset ${url} returned HTTP ${code}."
              exit 1
            fi
            echo "OK ${code} ${url}"
          done

          echo "七牛 ${MIRROR_PREFIX}/v2/${CHANNEL}/latest.json 已指向 ${TAG_NAME}。"
