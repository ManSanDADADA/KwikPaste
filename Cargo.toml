# 原生 2.0（GPUI）的 workspace。src-tauri 是 1.x 的 Tauri 版，自成 workspace，不在这里构建。
[workspace]
members = ["crates/*"]
exclude = ["src-tauri", "third_party"]
resolver = "3"

[workspace.package]
version = "2.0.1"
edition = "2024"
authors = ["LILTT"]
license = "Apache-2.0"
homepage = "https://paste.fastthree.com"
publish = false

# gpui 系列必须 `=` 钉版，并且与 third_party/gpui 下的副本版本一致：版本对不上时 [patch] 只给一条警告，
# 构建会悄悄换回 crates.io 上没打补丁的版本。只在 GPUI 升级时改这几行。
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", default-features = false, features = ["font-kit"] }
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.7" }
gpui-base = "=0.7.0"
gpui-component = "=0.7.0"
gpui-kit-assets = "=0.7.0"

anyhow = "1"
futures = "0.3"

kwikpaste-ui = { path = "crates/kwikpaste-ui" }

# kwikpaste-core。数据契约相关的 crate 与 src-tauri 用同一主版本，锁定版本尽量与 src-tauri/Cargo.lock 一致：
# sqlx 和它带的 libsqlite3-sys（SQLite 版本、迁移校验和）、serde 系、chrono、blake3（去重指纹）。
kwikpaste-core = { path = "crates/kwikpaste-core" }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
log = "0.4"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
# kwikpaste-core 的剪贴板管线，与 src-tauri 相同。
clipboard-rs = "0.3"
clipboard-win = "5"
file_icon_provider = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# 平台层（kwikpaste-os 与 kwikpaste-app/src/platform）。托盘、热键与 1.x 的 Tauri 插件同一系 crate；
# windows 与 GPUI 用同一个大版本，特性合并后不多编一份。

async-channel = "2"
dispatch2 = "0.3"
global-hotkey = "0.8"
kwikpaste-os = { path = "crates/kwikpaste-os" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-metal = { version = "0.3", default-features = false }
block2 = "0.6"
raw-window-handle = "0.6"
tray-icon = { version = "0.24", default-features = false }
windows = "0.62"
windows-registry = "0.6"
# kwikpaste-os 读 macOS 应用包的 Info.plist，与 src-tauri 相同。
plist = { version = "1", default-features = false }

# kwikpaste-core 的历史备份（.kwikpastebak 与 1.x 格式相同），版本与 src-tauri 一致。
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
walkdir = "2"
zeroize = "1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
# kwikpaste-core 的可读导出（Excel），与 src-tauri 相同。
rust_xlsxwriter = "0.99"
# kwikpaste-core 的局域网同步：mDNS 发现 + Noise 加密通道 + SPAKE2 配对码握手，与 src-tauri 相同。
# snow 不开 std：它的 std 特性会连带打开 ring，把 ring 重新编进安装包。
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4"

# kwikpaste-updater：2.x 自带的更新器（v2 清单、minisign 验签、三种安装交接、使用统计、公告）。
# reqwest 关掉默认特性（默认是 rustls + aws-lc-rs），成员 crate 里显式打开 native-tls 与 system-proxy，
# TLS 走系统实现，不把 rustls / ring 编进安装包。
kwikpaste-updater = { path = "crates/kwikpaste-updater" }
base64 = "0.22"
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false }
time = "0.3"
url = "2"
windows-sys = "0.61"
libc = "0.2"
# macOS 的 .app.tar.gz 解包；Windows 上只在测试里用。
flate2 = "1"
tar = "0.4"
# 只在测试里用：临时生成一次性 minisign 密钥对并签名（Ed25519 + BLAKE2b-512 预哈希）。
blake2 = "0.10"
ed25519-dalek = "2"

# 局域网同步 v2：IPv6 监听要显式设 IPV6_V6ONLY，与同端口的 IPv4 监听并存（tokio 已经依赖它）。
socket2 = "0.6"

# kwikpaste-os 在 macOS 上注入 ⌘V（CGEvent），与 GPUI 用的是同一个 crate。
objc2-core-graphics = { version = "0.3", default-features = false }
# macOS NSVisualEffectView 的内容层圆角。
objc2-quartz-core = { version = "0.3", default-features = false }

# kwikpaste-app 的 build.rs：给 Windows exe 嵌图标组（ID 1）和 VERSIONINFO。GPUI 也用它嵌 manifest，同一版本。
embed-resource = "3"

# kwikpaste-os 的 OLE 拖出自己实现 COM 接口：`#[implement]` 展开后引用 `windows_core`，要直接依赖它。
# 与 windows 0.62 配套，GPUI 已经在用，不多编一份。
windows-core = "0.62"

# 开机自启，与 src-tauri 相同（2.0 覆盖安装 1.x 后接管同一个启动项）。
auto-launch = "0.6"

[workspace.lints.rust]
unexpected_cfgs = "deny"

[patch.crates-io]
gpui-pre-windows = { path = "third_party/gpui/gpui-pre-windows" }
gpui-pre-macos = { path = "third_party/gpui/gpui-pre-macos" }
gpui-pre = { path = "third_party/gpui/gpui-pre" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# 与 src-tauri 的 release 配置一致，只多了 panic = "abort"。不要打开 debug-assertions：GPUI 会在运行时从 CARGO_MANIFEST_DIR 编译 HLSL。
# panic = "abort"：界面线程上的 panic 本来就会终止进程（窗口过程不能 unwind），后台线程和任务也一样直接退出，
# 不会“任务悄悄死了、程序还开着”（比如剪贴板监听停了却没人知道），由崩溃重启接手。unwind 的清理代码约占 exe 的三分之一，
# 安装包因此小约 1.3 MiB。dev 与测试不受影响（Cargo 给测试一律用 unwind）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

# 与 src-tauri 一致：去重指纹与图片哈希是热路径。
[profile.release.package.blake3]
opt-level = 3

# 与 src-tauri 一致：clipboard-rs 的 to_png / thumbnail 在调用方单态化，图片热路径保持 3。
[profile.release.package.clipboard-rs]
opt-level = 3
