[package]
name = "KwikPaste"
version = "1.3.2"
description = "A local-first clipboard manager for macOS and Windows."
authors = ["LILTT"]
license = "Apache-2.0"
homepage = "https://paste.fastthree.com"
readme = "../README.md"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kwikpaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 关掉默认的 dynamic-acl（运行时 add_capability，本项目不用）：权限清单不再整体编进二进制，
# 配合 tauri.conf.json 的 build.removeUnusedCommands 裁掉未授权的插件命令。x11 / dbus 只属于 Linux。
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "macos-private-api", "protocol-asset", "tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tauri-plugin-log = "2"
log = "0.4"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
blake3 = "1"
clipboard-rs = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
unicode-segmentation = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = "5"
auto-launch = "0.6"
file_icon_provider = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-os = "2"
# TLS 走系统实现（Windows SChannel / macOS Security.framework），不再打包 rustls + ring；
# zip 特性只服务 Windows zip 型更新包与 Linux AppImage，NSIS 更新包是 exe，便携版自己解 zip。
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# updater 关闭了 reqwest 默认特性，只认 HTTP(S)_PROXY 环境变量；从桌面启动的应用拿不到它，
# 这里借特性合并让 updater 读取 Windows / macOS 系统代理，否则 GitHub 端点会直连超时。
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
semver = "1"
time = "0.3"
drag = "2.1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
walkdir = "2"
tempfile = "3"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSURL", "NSArray", "NSGeometry", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSImage", "NSView", "NSWindow", "NSEvent", "NSApplication", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSDraggingItem", "NSDraggingSession", "NSAttributedString", "NSStringDrawing", "NSColor", "NSFont", "NSParagraphStyle", "NSBezierPath", "NSGraphics"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
plist = { version = "1", default-features = false }
tauri-plugin-macos-permissions = "2"
rodio = { version = "0.20", default-features = false, features = ["wav"] }

[target.'cfg(target_os = "windows")'.dependencies]
# clipboard-rs 已依赖它；图片写回要同时放原始 PNG 和 CF_DIB，clipboard-rs 的接口做不到。
clipboard-win = "5"
winapi = { version = "0.3", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winbase",
    "winnt",
    "minwindef",
    "windef",
] }
windows-registry = "0.6"
windows-version = "0.1"
windows-result = "0.4"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# 整体按体积优化（opt-level z + 全量 LTO），exe 从 27 MB 降到十几 MB。
# panic 保持 unwind：lib.rs 在 C 边界上靠 catch_unwind 兜底，abort 会让它失效。
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# 图片落盘 / 缩略图 / 哈希是热路径，opt-level z 下 4K 截图的 PNG 编码会慢十几倍，这些 crate 保持 3。
# 泛型在调用方单态化，clipboard-rs 的 to_png / thumbnail 也得一起留在 3。
[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.clipboard-rs]
opt-level = 3
