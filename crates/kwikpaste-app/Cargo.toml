[package]
name = "kwikpaste-app"
description = "KwikPaste native app (GPUI)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "KwikPaste"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# 只影响 macOS：运行时编译 Metal 着色器，构建机不需要 Xcode 的 metal 工具链。
runtime-shaders = ["gpui_platform/runtime_shaders"]
# 用正式版的 identifier（com.fastthree.kwikpaste），会与已安装的 1.x 互认单实例。
# 只有切换到原生版的发布流水线才打开；本机和 CI 的构建一律用开发 identifier。
production-identity = []
# Enables the local/CI self-update driver. Release builds never enable this feature.
e2e-overrides = ["kwikpaste-updater/e2e-overrides"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
# 保存图片的默认目录（下载文件夹，1.x 同）。
dirs.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
image = { workspace = true, features = ["ico"] }
kwikpaste-core.workspace = true
kwikpaste-os.workspace = true
kwikpaste-ui.workspace = true
kwikpaste-updater.workspace = true
log.workspace = true
raw-window-handle.workspace = true
semver.workspace = true
tempfile.workspace = true
# `rc`：列表条目的字符串用 `Arc<str>`，渲染时零拷贝转成 `SharedString`。
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tray-icon.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
workspace = true
features = ["std", "NSApplication", "NSRunningApplication", "NSWindow"]

[target.'cfg(target_os = "macos")'.dependencies.libc]
workspace = true

[lints]
workspace = true
