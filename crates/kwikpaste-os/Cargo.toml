[package]
name = "kwikpaste-os"
description = "KwikPaste integrations that only need native handles and OS APIs (no GPUI)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
auto-launch.workspace = true
kwikpaste-core.workspace = true
log.workspace = true
anyhow.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-core.workspace = true
windows-registry.workspace = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "UI_ViewManagement",
    "Foundation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
plist.workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
workspace = true
features = [
    "std",
    "NSApplication",
    "NSAccessibility",
    "NSAlert",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSound",
    "NSView",
    "NSVisualEffectView",
    "NSWorkspace",
    "NSWindow",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-quartz-core",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
workspace = true
features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
workspace = true
features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSGeometry",
    "NSLocale",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSError",
    "block2",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-quartz-core]
workspace = true
features = ["CALayer", "objc2-core-foundation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-metal]
workspace = true
features = ["std", "MTLDevice", "block2"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
