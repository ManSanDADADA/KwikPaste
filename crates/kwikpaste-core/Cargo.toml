[package]
name = "kwikpaste-core"
description = "KwikPaste's data contracts and business logic, free of Tauri and GPUI."
version.workspace = true
# 代码从 1.x 的 src-tauri（edition 2021）复制而来，两份要并存到 1.x 停止维护。保持 2021：
# rustfmt 风格、if let / 尾表达式临时值的析构时机都与 src-tauri 一致，1.x 的修复能按 diff 原样移植。
edition = "2021"
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
kwikpaste-ext-protocol = { path = "../kwikpaste-ext-protocol" }
anyhow.workspace = true
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clipboard-rs.workspace = true
dirs.workspace = true
file_icon_provider.workspace = true
if-addrs.workspace = true
# 单图文件记录的宽高与缩略图要读常见图片格式；这些解码器 clipboard-rs 的默认特性已经打开，这里写明依赖。
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "tiff", "webp"] }
log.workspace = true
mdns-sd.workspace = true
rand.workspace = true
regex.workspace = true
rust_xlsxwriter.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
snow.workspace = true
socket2.workspace = true
spake2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
unicode-segmentation.workspace = true
uuid.workspace = true
walkdir.workspace = true
zeroize.workspace = true
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# 图片写回要同时放原始 PNG 和 CF_DIB，clipboard-rs 的接口做不到。
clipboard-win.workspace = true
# 局域网同步身份绑定这台电脑：读 MachineGuid。
windows-registry.workspace = true
# exe 图标直接从资源里取（PrivateExtractIconsW），不经 Shell 命名空间，省下常驻的几 MB。
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[lints]
workspace = true
